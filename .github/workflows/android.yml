name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and build optimized release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-reports-and-unsigned-apk
          path: |
            app/build/reports/
            app/build/outputs/apk/release/*.apk
